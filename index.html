<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C# тест — 150 сұрақ</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe3ee;--ac:#3b5bdb;--ok:#2b9348;--okbg:#e6f6ec;--no:#d00000;--nobg:#fdeaea}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1d212c;--tx:#e8ebf3;--mut:#98a1b5;--bd:#2d3342;--ac:#7c93ff;--ok:#4cc16f;--okbg:#17301f;--no:#ff6b6b;--nobg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--ac);width:0;transition:width .2s}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;margin:0 0 10px;white-space:pre-wrap}
pre{background:#0f1320;color:#e6e9f5;padding:12px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Consolas,monospace;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default;color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
button.b.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.b:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{padding:6px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:13px inherit}
.grid button.cur{outline:2px solid var(--ac)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.no{background:var(--nobg);border-color:var(--no)}
.res{text-align:center}
.res .big{font-size:40px;font-weight:700}
.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stats>div{border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--mut)}
.stats .gd b{color:var(--ok)}
.stats .bd b{color:var(--no)}
.lbl{font-size:13px;color:var(--mut);margin:0 0 6px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modes button.act{background:var(--ac);color:#fff;border-color:var(--ac)}
label.sw{font-size:14px;color:var(--mut);display:inline-flex;gap:6px;align-items:center}

/* ===== Жаңа жыл тақырыбы (батырмамен қосылады/өшеді) ===== */
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.hrow h1{margin:0}
.nybtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#garland,#snow,#nyline,#nyscene{display:none}
body.ny{--bg:#e6f0ff;--card:rgba(255,255,255,.82);--bd:rgba(150,182,226,.55);--ac:#3b6fe0;--tx:#1b2438;--mut:#5d6b85;
  background:radial-gradient(520px 380px at 8% 2%,rgba(255,150,185,.38),transparent 65%),
             radial-gradient(640px 460px at 100% 18%,rgba(110,165,255,.48),transparent 65%),
             radial-gradient(520px 420px at 60% 100%,rgba(140,220,200,.30),transparent 65%),
             linear-gradient(180deg,#e2eeff 0%,#f5f9ff 55%,#fff0f4 100%) fixed}
body.ny .wrap{position:relative;z-index:1;padding-top:54px}
body.ny h1{font-size:23px}
body.ny h1::before{content:"🎄 "}
body.ny h1::after{content:" ⛄"}
body.ny .ttl{background:linear-gradient(90deg,#d62839,#e9a600,#2a9d8f,#3b6fe0,#d62839);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:nysh 9s linear infinite}
@keyframes nysh{to{background-position:300% 0}}
body.ny .card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(59,111,224,.13),inset 0 1px 0 rgba(255,255,255,.8);border-color:var(--bd)}
body.ny #quiz{position:relative}
body.ny #quiz::after{content:"🎁";position:absolute;top:-14px;right:14px;font-size:26px;transform:rotate(12deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
body.ny button.b:not(.sec),body.ny .modes button.act{background:linear-gradient(135deg,#3b82f6,#7c5cff);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,92,255,.35)}
body.ny button.b.sec:not(.act){background:rgba(255,255,255,.55)}
body.ny .opt:not(.ok):not(.no){background:rgba(255,255,255,.62)}
body.ny .opt:hover:not(:disabled){box-shadow:0 0 0 3px rgba(59,111,224,.15)}
body.ny .bar{height:10px;background:rgba(120,150,200,.25)}
body.ny .bar>div{background:repeating-linear-gradient(45deg,#ff5d73 0 9px,#ffffff 9px 18px);background-size:25.46px 25.46px;animation:nystripe 1.2s linear infinite}
@keyframes nystripe{to{background-position:25.46px 0}}
body.ny .stats>div{background:rgba(255,255,255,.45)}
/* кері санау */
body.ny #nyline{display:flex;justify-content:center;align-items:stretch;gap:10px;margin:0 0 16px;flex-wrap:wrap}
#nyline .nlb{width:100%;text-align:center;font-size:13px;color:var(--mut)}
#nyline .nt{min-width:64px;padding:8px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);text-align:center;box-shadow:0 4px 12px rgba(59,111,224,.10)}
#nyline .nt b{display:block;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
#nyline .nt span{font-size:11px;color:var(--mut)}
#nyline .nmsg{width:100%;text-align:center;font-size:16px;font-weight:600}
/* гирлянда */
body.ny #garland{display:block;position:absolute;top:0;left:0;width:100%;height:62px;z-index:30;pointer-events:none}
#garland svg{display:block;width:100%;height:62px;overflow:visible}
#garland .gb{animation:nytw 1.9s ease-in-out infinite}
@keyframes nytw{0%,100%{opacity:1}50%{opacity:.35}}
/* қар */
body.ny #snow{display:block;position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
#snow span{position:absolute;top:-8vh;color:#fff;text-shadow:0 0 5px rgba(80,120,190,.95);animation:nyfall linear infinite;will-change:transform;user-select:none}
@keyframes nyfall{0%{transform:translate3d(0,-8vh,0) rotate(0)}100%{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}
/* беттің соңындағы сурет */
body.ny #nyscene{display:block;position:relative;z-index:0;line-height:0;margin-top:6px}
#nyscene svg{display:block;width:100%;height:170px}
#nyscene .h2{fill:#d3e4fb}#nyscene .h1{fill:#ffffff}
#nyscene .lt{animation:nytw 1.7s ease-in-out infinite}
@media (prefers-color-scheme:dark){
  body.ny{--bg:#0d1829;--card:rgba(22,36,60,.78);--bd:rgba(110,140,200,.28);--ac:#8db4ff;--tx:#e8ebf3;--mut:#9eaccb;
    background:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 27% 8%,#cfe0ff,transparent),
      radial-gradient(1.8px 1.8px at 41% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 58% 12%,#ffe9a8,transparent),
      radial-gradient(1.6px 1.6px at 73% 26%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 9%,#cfe0ff,transparent),
      radial-gradient(1.4px 1.4px at 94% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 6% 46%,#fff,transparent),
      radial-gradient(600px 420px at 12% 0%,rgba(110,80,220,.35),transparent 65%),
      radial-gradient(640px 460px at 100% 25%,rgba(40,150,190,.32),transparent 65%),
      linear-gradient(180deg,#09131f 0%,#0f1f38 55%,#1a1832 100%) fixed}
  body.ny .card{box-shadow:0 10px 30px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.06)}
  body.ny .ttl{background-image:linear-gradient(90deg,#ff7b8a,#ffd166,#5fe0c3,#8db4ff,#ff7b8a)}
  body.ny button.b.sec:not(.act){background:rgba(255,255,255,.06)}
  body.ny .opt:not(.ok):not(.no){background:rgba(255,255,255,.05)}
  body.ny .stats>div{background:rgba(255,255,255,.04)}
  body.ny .bar{background:rgba(255,255,255,.12)}
  #nyscene .h2{fill:#1b2d4e}#nyscene .h1{fill:#b9cdee}
}
@media (prefers-reduced-motion:reduce){
  body.ny #snow{display:none}
  body.ny .ttl,body.ny .bar>div,#garland .gb,#nyscene .lt{animation:none}
}
</style>
</head>
<body>
<div id="garland" aria-hidden="true"></div>
<div id="snow" aria-hidden="true"></div>
<div class="wrap">
  <div class="hrow">
    <h1><span class="ttl">C# / ООП тест — 150 сұрақ</span></h1>
    <button class="b sec nybtn" id="nyToggle" type="button" aria-pressed="true">🎄 Жаңа жыл: қосулы</button>
  </div>
  <div id="nyline"></div>

  <div class="card">
    <p class="lbl">Бөлім</p>
    <div class="modes" id="parts">
      <button class="b sec act" data-p="p1">1-бөлім: 1–76</button>
      <button class="b sec" data-p="p2">2-бөлім: 77–150</button>
      <button class="b sec" data-p="p3">3-бөлім: код үзіндісі бар сұрақтар (48)</button>
      <button class="b sec" data-p="all">Барлығы: 1–150</button>
    </div>
    <p class="lbl">Режим</p>
    <div class="modes" id="modes" style="margin-bottom:0">
      <button class="b sec act" data-m="all">Барлық сұрақ</button>
      <button class="b sec" data-m="rand">Кездейсоқ 30 сұрақ</button>
      <button class="b sec" data-m="wrong">Қателермен жұмыс</button>
    </div>
  </div>

  <div class="card">
    <div class="top"><span><b>Дайындық статистикасы</b> <span id="stScope"></span></span>
      <button class="b sec" id="resetStats" style="padding:4px 10px">Статистиканы тазалау</button></div>
    <div class="stats">
      <div><b id="stAll">0</b><span>Барлық сұрақ саны</span></div>
      <div><b id="stAns">0</b><span>Жауап берілген сұрақтар</span></div>
      <div class="gd"><b id="stOk">0</b><span>Дұрыс жауаптар</span></div>
      <div class="bd"><b id="stBad">0</b><span>Қате жауаптар</span></div>
      <div><b id="stPct">0%</b><span>Дайындық пайызы</span></div>
    </div>
    <div class="bar"><div id="stBar"></div></div>
  </div>

  <div class="card" id="quiz">
    <div class="top"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div style="height:14px"></div>
    <p class="q" id="qt"></p>
    <pre id="qc" class="hide"></pre>
    <div id="opts"></div>
    <div class="row">
      <button class="b sec" id="prev">← Алдыңғы</button>
      <button class="b" id="next">Келесі →</button>
      <button class="b sec" id="finish">Аяқтау</button>
    </div>
  </div>
  <div class="card hide" id="result"></div>
  <div class="card">
    <div class="top"><span>Сұрақтар</span>
      <span>
        <label class="sw"><input type="checkbox" id="shuf"> Сұрақтарды араластыру</label>
        <button class="b sec" id="restart" style="padding:4px 10px;margin-left:8px">Қайта бастау</button>
      </span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="nyscene" aria-hidden="true">
<svg viewBox="0 0 900 170" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="nytree">
      <rect x="-6" y="78" width="12" height="13" fill="#6b4423"/>
      <polygon points="0,34 -42,80 42,80" fill="#176b43"/>
      <polygon points="0,16 -34,56 34,56" fill="#1f8052"/>
      <polygon points="0,0 -26,34 26,34" fill="#27a066"/>
      <polygon points="0,-12 3,-5 11,-5 5,0 7,8 0,3 -7,8 -5,0 -11,-5 -3,-5" fill="#ffd166"/>
      <circle class="lt" cx="-9" cy="24" r="2.6" fill="#ff5d73"/>
      <circle class="lt" cx="10" cy="18" r="2.6" fill="#ffd166" style="animation-delay:.4s"/>
      <circle class="lt" cx="-18" cy="46" r="2.6" fill="#4dabf7" style="animation-delay:.8s"/>
      <circle class="lt" cx="16" cy="44" r="2.6" fill="#ff5d73" style="animation-delay:.2s"/>
      <circle class="lt" cx="-27" cy="70" r="2.6" fill="#ffd166" style="animation-delay:1s"/>
      <circle class="lt" cx="25" cy="68" r="2.6" fill="#4dabf7" style="animation-delay:.6s"/>
      <circle class="lt" cx="0" cy="60" r="2.6" fill="#ff8fab" style="animation-delay:1.2s"/>
    </g>
  </defs>
  <path class="h2" d="M0 118 Q150 68 320 104 T640 94 T900 108 V170 H0Z"/>

  <use href="#nytree" transform="translate(835,58) scale(.75)"/>
  <path class="h1" d="M0 140 Q200 104 420 134 T900 124 V170 H0Z"/>
  <use href="#nytree" transform="translate(762,40)"/>
  <g>
    <rect x="590" y="112" width="22" height="17" fill="#c1121f"/><rect x="599" y="112" width="4" height="17" fill="#ffd166"/><rect x="590" y="118" width="22" height="4" fill="#ffd166"/>
    <rect x="618" y="119" width="15" height="12" fill="#2a9d8f"/><rect x="624" y="119" width="3" height="12" fill="#fff"/><rect x="618" y="123" width="15" height="3" fill="#fff"/>
  </g>
  <g stroke="#9db8dd" stroke-width="1.2">
    <line x1="107" y1="86" x2="91" y2="76" stroke="#6b4423" stroke-width="2"/><line x1="133" y1="86" x2="149" y2="76" stroke="#6b4423" stroke-width="2"/>
    <circle cx="120" cy="112" r="18" fill="#fff"/><circle cx="120" cy="86" r="13" fill="#fff"/><circle cx="120" cy="65" r="10" fill="#fff"/>
  </g>
  <rect x="106" y="55" width="28" height="3" fill="#2b2d42"/><rect x="110" y="46" width="20" height="10" fill="#2b2d42"/><rect x="110" y="52" width="20" height="2.5" fill="#c1121f"/>
  <circle cx="116.5" cy="63" r="1.5" fill="#222"/><circle cx="123.5" cy="63" r="1.5" fill="#222"/>
  <polygon points="120,66 131,68.5 120,70" fill="#f77f00"/>
  <rect x="109" y="73" width="22" height="4.5" rx="2" fill="#d62839"/><rect x="125" y="75" width="4.5" height="13" fill="#d62839"/>
  <circle cx="120" cy="84" r="1.5" fill="#222"/><circle cx="120" cy="91" r="1.5" fill="#222"/>
</svg>
</div>

<script type="text/plain" id="data">
#1
Объектіге бағытталған бағдарламалау парадигмасының негізгі тұжырымдамасы қандай?
A) Тек функцияларды пайдалану
B) Бағдарламаны объектілер мен кластар негізінде құру
C) Тек айнымалылармен жұмыс істеу
D) Кодты тек бір файлда жазу
=B
#2
Әдісті шақырған кезде C# тіліндегі берілген код нені шығарады?
class Person
{
    public string Name = "Alex";
}
Person p = new Person();
Console.Write(p.Name);
A) Person
B) Name
C) Alex
D) Қате
=C
#3
Қандай қол жеткізу модификаторы класс элементін ТЕК осы класстың ішінде қолжетімді етеді?
A) public
B) protected
C) internal
D) private
=D
#4
C# тіліндегі класс конструкторы қандай рөл атқарады?
A) Объектіні жою
B) Объектіні құру және бастапқы мәндерін орнату
C) Класты мұрагерлікке алу
D) Әдістерді өшіру
=B
#5
C# тіліндегі келесі код үзіндісі нені шығарады?
class Car
{
    public int Speed;
    public Car(int speed)
    {
        Speed = speed;
    }
}
Car c = new Car(100);
Console.Write(c.Speed);
A) 0
B) 100
C) speed
D) Қате
=B
#6
Объектіге бағытталған бағдарламалауда (ООП) инкапсуляция деп нені түсінеді?
A) Бір кластан бірнеше класс құру
B) Деректер мен әдістерді біріктіріп, деректерге қолжетімділікті шектеу
C) Бір әдісті бірнеше рет шақыру
D) Объектілерді жою
=B
#7
C# тіліндегі қандай қол жеткізу модификаторы класс мүшесіне ағымдағы жинақ (.dll/.exe) шегінде қолжетімділікке рұқсат береді?
A) private
B) protected
C) internal
D) public
=C
#8
Жеке (private) айнымалыға қол жеткізуге тырысқанда бұл код нені шығарады?
class Account
{
    private int balance = 500;
}
Account acc = new Account();
Console.Write(acc.balance);
A) 500
B) 0
C) null
D) Компиляция қатесі
=D
#9
C# тілінде автоқасиеттер (Auto-Properties) не үшін қолданылады?
A) Класты автоматты түрде жою үшін
B) Қасиеттерді қысқа түрде жариялау үшін
C) Объектіні көшіру үшін
D) Цикл құру үшін
=B
#10
Логикасы бар қасиетті қолданатын C# код үзіндісі нені шығарады?
class User
{
    private int _age;
    public int Age
    {
        get => _age;
        set => _age = value < 0 ? 0 : value;
    }
}
User u = new User();
u.Age = -15;
Console.Write(u.Age);
A) -15
B) 15
C) 0
D) Қате
=C
#11
C# тілінде бір класты екіншісінен мұрагерлікке алу үшін қандай кілт сөз қолданылады?
A) implements
B) extends
C) base
D) : (қос нүкте)
=D
#12
Мұраланған әдісті шақырған кезде бұл код нені шығарады?
class Animal
{
    public void Eat() => Console.Write("Food");
}
class Dog : Animal { }Dog d = new Dog();
d.Eat();
A) Dog
B) Animal
C) Food
D) Қате
=C
#13
C# тілінде негізгі класста еншілес класқа әдісті қайта анықтауға рұқсат беру үшін қандай кілт сөз қолданылады?
A) override
B) virtual
C) sealed
D) static
=B
#14
C# тілінде негізгі класстың виртуалды әдісін қайта анықтау үшін еншілес класста қандай кілт сөз қолданылады?
A) virtual
B) new
C) override
D) base
=C
#15
Полиморфизмі бар келесі код үзіндісі нені шығарады?
class Printer
{
    public virtual void Print() => Console.Write("Base");
}
class ColorPrinter : Printer
{
    public override void Print() => Console.Write("Color");
}
Printer p = new ColorPrinter();
p.Print();

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var raw=$('data').textContent;
  var parts=raw.split(/^#(\d+)\n/m), ALL=[];
  for(var k=1;k<parts.length;k+=2){
    var lines=parts[k+1].replace(/\s+$/,'').split('\n'), opts=[], pre=[], ans=-1;
    lines.forEach(function(l){
      var m=l.match(/^([A-E])\) (.*)$/);
      if(m){opts.push(m[2]);}
      else if(/^=[A-E]$/.test(l)){ans='ABCDE'.indexOf(l[1]);}
      else pre.push(l);
    });
    ALL.push({n:parseInt(parts[k],10),q:pre[0],code:pre.slice(1).join('\n'),opts:opts,ans:ans});
  }
  var KEY='csharp_hist_v2', hist={}, part='p1', mode='all', Q=[], cur=0, picked={};
  try{hist=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){hist={}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(hist))}catch(e){}}
  function scope(){
    return ALL.filter(function(x){return part==='all'||(part==='p1'?x.n<=76:part==='p2'?x.n>=77:!!x.code)});
  }
  function stats(){
    var S=scope(),ans=0,ok=0;
    S.forEach(function(x){if(hist[x.n]!==undefined){ans++;if(hist[x.n]===x.ans)ok++}});
    var pct=S.length?Math.round(ok/S.length*100):0;
    $('stScope').textContent='('+(part==='p1'?'1-бөлім':part==='p2'?'2-бөлім':part==='p3'?'3-бөлім':'барлығы')+')';
    $('stAll').textContent=S.length;
    $('stAns').textContent=ans;
    $('stOk').textContent=ok;
    $('stBad').textContent=ans-ok;
    $('stPct').textContent=pct+'%';
    $('stBar').style.width=pct+'%';
  }
  function render(){
    stats();
    var q=Q[cur];
    $('pos').textContent='Сұрақ '+(cur+1)+' / '+Q.length+'  (№'+q.n+')';
    var ok=0,done=0;Q.forEach(function(x,i){if(picked[i]!==undefined){done++;if(picked[i]===x.ans)ok++}});
    $('score').textContent='Дұрыс: '+ok+' / '+done;
    $('prog').style.width=(done/Q.length*100)+'%';
    $('qt').textContent=q.n+'. '+q.q;
    var pc=$('qc'); if(q.code){pc.textContent=q.code;pc.classList.remove('hide')}else pc.classList.add('hide');
    var box=$('opts');box.innerHTML='';
    q.opts.forEach(function(t,i){
      var b=document.createElement('button');b.className='opt';b.textContent='ABCDE'[i]+') '+t;
      if(picked[cur]!==undefined){
        b.disabled=true;
        if(i===q.ans)b.classList.add('ok');
        else if(i===picked[cur])b.classList.add('no');
      }
      b.onclick=function(){picked[cur]=i;hist[q.n]=i;save();render()};
      box.appendChild(b);
    });
    $('prev').disabled=cur===0;
    $('next').disabled=cur===Q.length-1;
    var g=$('grid');g.innerHTML='';
    Q.forEach(function(x,i){
      var b=document.createElement('button');b.textContent=x.n;
      if(i===cur)b.classList.add('cur');
      if(picked[i]!==undefined)b.classList.add(picked[i]===x.ans?'ok':'no');
      b.onclick=function(){cur=i;render();window.scrollTo(0,0)};
      g.appendChild(b);
    });
  }
  function finish(){
    var ok=0,done=0;Q.forEach(function(x,i){if(picked[i]!==undefined){done++;if(picked[i]===x.ans)ok++}});
    var r=$('result');r.classList.remove('hide');
    var pct=Math.round(ok/Q.length*100);
    r.innerHTML='<div class="res"><div class="big">'+ok+' / '+Q.length+' ('+pct+'%)</div><p>Жауап берілді: '+done+' · Қате: '+(done-ok)+' · Жауап берілмеді: '+(Q.length-done)+'</p></div>';
    r.scrollIntoView({behavior:'smooth'});
  }
  function mark(id,attr,val){
    Array.prototype.forEach.call(document.querySelectorAll('#'+id+' button'),function(b){b.classList.toggle('act',b.getAttribute(attr)===val)});
  }
  function start(){
    var base=scope();
    if(mode==='wrong'){
      base=base.filter(function(x){return hist[x.n]!==undefined&&hist[x.n]!==x.ans});
      if(!base.length){alert('Қате жауаптар жоқ. Алдымен тест тапсырыңыз немесе барлық сұрақтарға дұрыс жауап бердіңіз!');mode='all';base=scope();}
    }
    if(mode==='rand'||$('shuf').checked){for(var i=base.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=base[i];base[i]=base[j];base[j]=t}}
    if(mode==='rand')base=base.slice(0,30);
    Q=base;
    mark('parts','data-p',part);mark('modes','data-m',mode);
    picked={};cur=0;$('result').classList.add('hide');render();window.scrollTo(0,0);
  }
  Array.prototype.forEach.call(document.querySelectorAll('#parts button'),function(b){
    b.onclick=function(){part=b.getAttribute('data-p');start()};
  });
  Array.prototype.forEach.call(document.querySelectorAll('#modes button'),function(b){
    b.onclick=function(){mode=b.getAttribute('data-m');start()};
  });
  $('resetStats').onclick=function(){if(confirm('Статистика тазаланады. Жалғастыру керек пе?')){hist={};save();start()}};
  $('prev').onclick=function(){if(cur>0){cur--;render()}};
  $('next').onclick=function(){if(cur<Q.length-1){cur++;render()}};
  $('finish').onclick=finish;
  $('restart').onclick=start;
  $('shuf').onchange=start;
  start();
})();
</script>

<script>
(function(){
  var KEY='ny_theme_v1', on=true, timer=null;
  try{var v=localStorage.getItem(KEY); if(v==='off') on=false;}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var btn=$('nyToggle'), g=$('garland'), sn=$('snow'), line=$('nyline');
  var colors=['#ff4d6d','#ffd166','#2ec4b6','#4dabf7','#ff9ff3'];
  var NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function buildGarland(){
    g.innerHTML='';
    var W=window.innerWidth, n=Math.max(4,Math.round(W/(W<600?100:130))), seg=W/n, sag=36;
    var svg=el('svg',{viewBox:'0 0 '+W+' 62',preserveAspectRatio:'none'});
    var d='M0 0';
    for(var i=0;i<n;i++){d+=' Q '+(i*seg+seg/2)+' '+sag+' '+((i+1)*seg)+' 0';}
    svg.appendChild(el('path',{d:d,fill:'none',stroke:'#3d4a5a','stroke-width':2.2,'stroke-linecap':'round'}));
    var k=0, per=4, c=0;
    for(var s=0;s<n;s++){
      for(var j=1;j<=per;j++){
        var t=j/(per+1), x=(1-t)*(1-t)*(s*seg)+2*(1-t)*t*(s*seg+seg/2)+t*t*((s+1)*seg), y=2*(1-t)*t*sag;
        var col=colors[c++%colors.length];
        var gr=el('g',{transform:'translate('+x.toFixed(1)+','+y.toFixed(1)+')'});
        gr.appendChild(el('rect',{x:-2.6,y:-1,width:5.2,height:5,rx:1,fill:'#2d3748'}));
        var b=el('ellipse',{cx:0,cy:12,rx:5.4,ry:8,fill:col,'class':'gb'});
        b.style.animationDelay=((c%5)*0.32)+'s';
        b.style.filter='drop-shadow(0 0 5px '+col+')';
        gr.appendChild(b);
        gr.appendChild(el('ellipse',{cx:-1.8,cy:9,rx:1.3,ry:2.4,fill:'#fff','fill-opacity':0.55}));
        svg.appendChild(gr);
      }
    }
    g.appendChild(svg);
  }
  function buildSnow(){
    sn.innerHTML='';
    var m=window.innerWidth<600;
    var layers=[{n:m?12:22,s:[8,12],o:[.4,.55],d:[18,28],b:'blur(.6px)'},
                {n:m?9:16,s:[12,18],o:[.65,.8],d:[11,18],b:'none'},
                {n:m?4:7,s:[20,30],o:[.85,.95],d:[7,11],b:'blur(1.3px)'}];
    layers.forEach(function(L){
      for(var j=0;j<L.n;j++){
        var f=document.createElement('span');
        f.textContent=j%3?'❄':'❅';
        f.style.left=(Math.random()*100)+'%';
        f.style.fontSize=(L.s[0]+Math.random()*(L.s[1]-L.s[0]))+'px';
        f.style.opacity=(L.o[0]+Math.random()*(L.o[1]-L.o[0])).toFixed(2);
        f.style.animationDuration=(L.d[0]+Math.random()*(L.d[1]-L.d[0]))+'s';
        f.style.animationDelay=(-Math.random()*L.d[1])+'s';
        f.style.filter=L.b;
        f.style.setProperty('--dx',(Math.random()*90-45)+'px');
        sn.appendChild(f);
      }
    });
  }
  function tick(){
    var now=new Date();
    if(now.getMonth()===0&&now.getDate()<=7){
      line.innerHTML='<div class="nmsg">🎆 Жаңа жыл құтты болсын! Сессияға сәттілік! 🎆</div>';return;
    }
    var ny=new Date(now.getFullYear()+1,0,1), ms=ny-now;
    var d=Math.floor(ms/864e5), h=Math.floor(ms%864e5/36e5), mi=Math.floor(ms%36e5/6e4), se=Math.floor(ms%6e4/1e3);
    var p=function(x){return x<10?'0'+x:''+x};
    line.innerHTML='<div class="nlb">🎁 Жаңа жылға дейін</div>'+
      '<div class="nt"><b>'+d+'</b><span>күн</span></div><div class="nt"><b>'+p(h)+'</b><span>сағат</span></div>'+
      '<div class="nt"><b>'+p(mi)+'</b><span>минут</span></div><div class="nt"><b>'+p(se)+'</b><span>секунд</span></div>';
  }
  function apply(){
    document.body.classList.toggle('ny',on);
    btn.textContent=on?'🎄 Жаңа жыл: қосулы':'Жаңа жыл: өшірулі';
    btn.setAttribute('aria-pressed',on?'true':'false');
    clearInterval(timer);
    if(on){buildGarland();buildSnow();tick();timer=setInterval(tick,1000);}
    else{g.innerHTML='';sn.innerHTML='';line.innerHTML='';}
  }
  btn.onclick=function(){on=!on;try{localStorage.setItem(KEY,on?'on':'off')}catch(e){}apply();};
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(on){buildGarland();buildSnow()}},250)});
  apply();
})();
</script>
</body>
</html>
